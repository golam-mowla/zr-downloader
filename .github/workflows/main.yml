name: "Release & Build ZR Downloader"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri 2 App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'ZR Downloader v__VERSION__' || '' }}
          releaseBody: 'Automated release build of ZR Downloader (Windows & Native Android).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZR-Downloader-Windows-x64
          path: |
            src-tauri/target/release/zr-downloader.exe
            src-tauri/target/release/ZR Downloader.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Native Android APK and AAB (Kotlin + Jetpack Compose)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          GRADLE_OPTS: "-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace || true

      - name: Collect Android Release Packages
        run: |
          mkdir -p release-android
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} release-android/ \;
          find android/app/build/outputs/bundle -type f -name "*.aab" -exec cp {} release-android/ \;
          ls -la release-android/

      - name: Upload Android Artifacts (APK + AAB)
        uses: actions/upload-artifact@v4
        with:
          name: ZR-Downloader-Android-APK-AAB
          path: release-android/*

      - name: Attach APK and AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
